# Dependabot — only minor + patch for Node/Bun packages.
#
# Allowed:  5.9.4 → 5.9.5 (patch),  6.4.7 → 6.5.8 (minor)
# Blocked:  5.9.4 → 6.0.1 (major), TypeScript 5 → 6/7, etc.
#
# Majors must be upgraded manually after Quality is green.
version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      js-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
