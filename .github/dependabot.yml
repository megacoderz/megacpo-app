# Automated dependency updates — Bun lockfile + GitHub Actions.
#
# Policy: weekly group = minor/patch only. All semver majors ignored (incl.
# TypeScript 7+ / Expo breakage). Majors are upgraded manually when CI is ready.
version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    groups:
      js-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
